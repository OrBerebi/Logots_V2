# Robot speaker output: the "demixer" ALSA PCM that speak() plays through (SPEAKER_DEVICE in
# src/audio_on_demand.py). plug = automatic rate conversion (Piper outputs 22050 Hz, the
# hardware runs at 48000 Hz); dmix = software mixing, over the Tegra APE sound card.
#
# Copied from robot #1's /etc/asound.conf on 2026-10-31. The rest of that file is NVIDIA's
# stock config, which every Jetson already has, so append only this block (from the repo root):
#   grep -q demixer /etc/asound.conf || sudo tee -a /etc/asound.conf < docs/robot1_system/asound_demixer.conf
# Test from a NoMachine terminal (unset PULSE_SERVER first, see CLAUDE.md Critical rule 6):
#   unset PULSE_SERVER; speaker-test -D demixer -c 2 -t sine -l 1

pcm.demixer {
	type plug
	slave {
		pcm "dmix:APE,0"
		channels 2
		rate 48000
	}
}
